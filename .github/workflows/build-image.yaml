name: build-image
run-name: Build the shimboot disk image for all boards
on: [push]

jobs:
  build:
    permissions:
      contents: write

    strategy: 
      matrix:
        board: [dedede]

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'
          remove-codeql: 'true'

      - name: download repo
        uses: actions/checkout@v4

      - name: Prepare larger /tmp
        run: |
          mkdir -p "$GITHUB_WORKSPACE/large-tmp"
          sudo mount --bind "$GITHUB_WORKSPACE/large-tmp" /tmp
          sudo chmod 1777 /tmp
          df -h /tmp

      - name: run build
        run: |
          sudo apt-get update
          # No apt-get upgrade needed – the build script installs required dependencies itself
          sudo DEBUG=1 ./build_complete.sh ${{ matrix.board }} release=unstable compress_img=1 quiet=1

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_${{ matrix.board }}
          path: data/shimboot_${{ matrix.board }}.bin
          compression-level: 7
  
      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/shimboot_${{ matrix.board }}.zip
